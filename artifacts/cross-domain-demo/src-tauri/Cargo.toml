[package]
name = "demo-siem"
version = "1.2.0"
description = "Demo SIEM — High-Side Multi-Classification Security Event Monitor"
authors = ["Will Lawson"]
edition = "2021"

[lib]
name = "demo_siem_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
